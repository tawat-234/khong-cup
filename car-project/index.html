<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Car Control</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #243b55, #0f172a);

    color: white;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}

.container {

    width: 95%;

    max-width: 500px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(15px);

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.4);

    text-align: center;
}

h1 {

    margin-top: 0;

    font-size: 28px;
}

.status {

    padding: 10px;

    border-radius: 10px;

    background: #ef4444;

    margin-bottom: 20px;

    font-weight: bold;
}

button {

    border: none;

    color: white;

    background: #334155;

    cursor: pointer;

    transition: 0.15s;

    user-select: none;

    -webkit-user-select: none;
}

button:active {

    transform: scale(0.92);

    background: #0ea5e9;
}

.connect {

    width: 100%;

    padding: 15px;

    border-radius: 12px;

    background: #2563eb;

    font-size: 17px;

    margin-bottom: 25px;
}

.control {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 12px;

    max-width: 350px;

    margin: auto;
}

.control button {

    height: 80px;

    border-radius: 20px;

    font-size: 32px;

    font-weight: bold;
}

.forward {

    grid-column: 2;
}

.left {

    grid-column: 1;
    grid-row: 2;
}

.stop {

    grid-column: 2;
    grid-row: 2;

    background: #dc2626;
}

.right {

    grid-column: 3;
    grid-row: 2;
}

.backward {

    grid-column: 2;
    grid-row: 3;
}

.speed {

    margin-top: 30px;

    text-align: left;
}

input[type="range"] {

    width: 100%;
}


</style>

</head>

<body>

<div class="container">

    <div id="status" class="status">
        Disconnected
    </div>

    <button
        class="connect"
        onclick="connectBluetooth()">

        🔵 Connect Bluetooth

    </button>

    <div class="control">

        <button
            class="forward"
            onpointerdown="sendCommand('F')"
            onpointerup="sendCommand('S')">

            ▲

        </button>

        <button
            class="left"
            onpointerdown="sendCommand('L')"
            onpointerup="sendCommand('S')">

            ◀

        </button>

        <button
            class="stop"
            onclick="sendCommand('S')">

            ■

        </button>

        <button
            class="right"
            onpointerdown="sendCommand('R')"
            onpointerup="sendCommand('S')">

            ▶

        </button>

        <button
            class="backward"
            onpointerdown="sendCommand('B')"
            onpointerup="sendCommand('S')">

            ▼

        </button>

    </div>


</div>


<script src="app.js"></script>

</body>

</html>
